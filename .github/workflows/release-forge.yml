name: release forge
on:
  push:
    tags:
      # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet
      # Example: 1.0.0-MC1.19.x-forge
      - "[0-9]+.[0-9]+.[0-9]+-MC[0-9]+.[0-9]+.[0-9x]+-forge"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Gradle Build
        run: ./gradlew :forge:build
      - name: Publish
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: PpYYCciX
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-dependencies: |
            kotlin-for-forge(required)
            9s6osm5g(required)

          curseforge-id: 399201
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-dependencies: |
            351264(required)
            348521(required)
            317269(optional)

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-files: forge/build/libs/*.jar

          files: forge/build/libs/!(*-@(dev|sources|javadoc)).jar
          name: Motor Assistance ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: CHANGELOG-forge.md
          loaders: forge
          environment: client
          game-versions: 1.20.1
