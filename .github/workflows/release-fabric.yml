name: release fabric
on:
  push:
    tags:
      # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet
      # Example: 1.0.0-MC1.19.x-fabric
      - "[0-9]+.[0-9]+.[0-9]+-MC[0-9]+.[0-9]+.[0-9x]+-fabric"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Gradle Build
        run: ./gradlew :fabric:build
      - name: Publish
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: PpYYCciX
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-dependencies: |
            fabric-language-kotlin(required)
            9s6osm5g(required)
            mOgUt4GM(optional)

          curseforge-id: 676747
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-dependencies: |
            308769(required)
            348521(required)
            308702(optional)
            317269(optional)

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-files: fabric/build/libs/*.jar

          files: fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
          name: Motor Assistance ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: CHANGELOG-fabric.md
          loaders: fabric
          environment: client
          game-versions: 1.20.1
