name: release forge
on:
  push:
    tags:
      # Examples: 3.1.2-MC26.2-forge, 3.1.3-MC26.2.1-forge
      - "[0-9]+.[0-9]+.[0-9]+-MC[0-9]+.[0-9x]+-forge"
      - "[0-9]+.[0-9]+.[0-9]+-MC[0-9]+.[0-9]+.[0-9x]+-forge"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Gradle Build
        run: ./gradlew :forge:build
      - name: Read project metadata
        id: project
        shell: bash
        run: echo "minecraft_version=$(sed -n 's/^minecraft_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: Publish
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: PpYYCciX
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 399201
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-files: forge/build/libs/*.jar

          files: forge/build/libs/!(*-@(dev|sources|javadoc)).jar
          name: Motor Assistance ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: CHANGELOG_FORGE.md
          loaders: forge
          environment: client
          game-versions: ${{ steps.project.outputs.minecraft_version }}
